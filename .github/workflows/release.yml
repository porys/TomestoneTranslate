name: release
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v2
      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: "10.x"

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build Release
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          dotnet build "Tomestone.Translate\Tomestone.Translate.csproj" -c Release -p:Version="$ver" --nologo

      - name: Stage package
        run: |
          Copy-Item "Tomestone.Translate\bin\Release\Tomestone.Translate\latest.zip" -Destination ".\Tomestone.Translate.zip" -Force

      - name: Create Release
        run: |
          gh release create "${{ github.ref_name }}" --latest --title "${{ github.ref_name }}" --notes "Release ${{ github.ref_name }}"
          gh release upload "${{ github.ref_name }}" "Tomestone.Translate.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update pluginmaster (xivplugins)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.XIVPLUGINS_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          cur=$(grep -oP '"AssemblyVersion": "\K[^"]+' deploy/pluginmaster.json)
          if [ "$ver" = "$cur" ]; then
            echo "Version $ver unchanged, skipping pluginmaster update"
            exit 0
          fi
          sed -i "s/\"AssemblyVersion\": \"$cur\"/\"AssemblyVersion\": \"$ver\"/" deploy/pluginmaster.json
          sed -i "s/\"LastUpdate\": [0-9]*/\"LastUpdate\": $(date +%s)/" deploy/pluginmaster.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add deploy/pluginmaster.json
          git commit -m "pluginmaster: bump $ver"
          git push origin HEAD:main
          git clone https://github.com/porys/xivplugins xiv
          cp deploy/pluginmaster.json xiv/pluginmaster.json
          git -C xiv config user.name "github-actions"
          git -C xiv config user.email "actions@github.com"
          git -C xiv add pluginmaster.json
          git -C xiv commit -m "Tomestone Translate $ver"
          git -C xiv push